# The known answer for lane R on reference-src/. Read by eval/rules_recall.py; never shown to
# the miner — a miner that has seen this file is being scored on copying, not mining.
#
# A card MATCHES a rule when one of its evidence entries points into one of the rule's
# `locations` (path, and a `line` inside the range) AND its kind is one of `kinds`. More than
# one kind is listed only where the schema's own definitions genuinely overlap for that rule;
# a single kind means the others would be a misreading. `invariant` is not in the schema
# before E13, so G-21 and G-22 are expected to show up as near misses until it is: that is
# the gap the baseline exists to put a number on.
#
# `values` is for the strict score: every group must appear somewhere in the card's
# given/when/then (case-insensitive, any one alternative per group). It is what separates a
# `then` a test can assert on from one that restates the route.
#
# `hard` names why a rule is in the set when it is one of the classes the AgentModernize paper
# reports as hardest to extract (defaults, error handlers, cross-module). Changing line
# numbers in reference-src/ means changing them here — the two are one fixture.

fixture: rules-recall
domain: billing

rules:
  - id: G-01
    kinds: [calculation, derivation]
    path_kind: normal
    rule: A line item's amount is quantity × unit_price, rounded half-even to 2 decimal places.
    locations:
      - { path: app/models/line_item.rb, lines: [21, 23] }
    values: [["half-even", "half_even", "half even", "half: :even", "banker"]]

  - id: G-02
    kinds: [calculation]
    path_kind: normal
    rule: Tax is subtotal × the customer region's rate (EU 0.20, UK 0.20, SG 0.09), rounded half-even; total is subtotal + tax.
    locations:
      - { path: app/models/invoice.rb, lines: [20, 25] }
      - { path: config/billing.rb, lines: [2, 6] }
    values: [["0.20", "20%"], ["0.09", "9%"]]

  - id: G-03
    kinds: [calculation]
    path_kind: normal
    rule: Late fee is outstanding × 1.5% per full 30 days overdue, capped at 25.00; zero before the first full period.
    locations:
      - { path: app/services/late_fee_calculator.rb, lines: [7, 13] }
      - { path: config/billing.rb, lines: [8, 10] }
    values: [["1.5%", "0.015"], ["30"], ["25"]]

  - id: G-04
    kinds: [validation]
