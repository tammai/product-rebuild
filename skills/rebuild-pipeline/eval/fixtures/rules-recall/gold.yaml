      - { path: app/policies/invoice_policy.rb, lines: [13, 15] }
      - { path: app/controllers/invoices_controller.rb, lines: [25, 25] }
    values: [["finance"], ["owner"], ["403", "forbidden"]]

  - id: G-08
    kinds: [eligibility, validation]
    path_kind: normal
    rule: An invoice for a customer on credit hold cannot be issued (422 "customer is on credit hold").
    locations:
      - { path: app/services/invoice_issuer.rb, lines: [12, 12] }
    values: [["credit hold", "credit_hold"]]

  - id: G-09
    kinds: [validation]
    path_kind: normal
    rule: An invoice with no line items cannot be issued (422 "invoice has no line items").
    locations:
