    hard: error path, and its constant lives in a different file
    locations:
      - { path: app/services/payment_recorder.rb, lines: [43, 44] }
      - { path: config/billing.rb, lines: [13, 13] }
    values: [["5"], ["10", "2^", "2**", "doubl"]]

