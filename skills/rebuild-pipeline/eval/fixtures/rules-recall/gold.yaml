    rule: A payment larger than the outstanding amount is rejected with 422 "overpayment".
    locations:
      - { path: app/services/payment_recorder.rb, lines: [13, 13] }
      - { path: app/controllers/invoices_controller.rb, lines: [20, 21] }
    values: [["422", "unprocessable"], ["overpayment"]]

  - id: G-06
