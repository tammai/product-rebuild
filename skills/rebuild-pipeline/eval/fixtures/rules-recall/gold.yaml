    rule: Quantity must be an integer from 1 to 10,000, else rejected with "quantity out of range".
    locations:
      - { path: app/models/line_item.rb, lines: [5, 10] }
    values: [["10000", "10,000", "10_000"], ["quantity out of range"]]

  - id: G-05
    kinds: [validation]
